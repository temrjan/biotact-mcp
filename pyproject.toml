[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biotact-mcp"
version = "0.1.0"
description = "MCP server for Biotact knowledge base"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
